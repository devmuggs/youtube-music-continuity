<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      min-height: 400px;
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #fff;
    }

    .logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo h1 {
      margin: 0;
      font-size: 18px;
      color: #ff0000;
    }

    .auth-container {
      display: block;
    }

    .user-container {
      display: none;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #aaa;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #333;
      border-radius: 4px;
      background: #2a2a2a;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #ff0000;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 4px;
      background: #ff0000;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 10px;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #cc0000;
    }

    .btn:disabled {
      background: #666;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #333;
    }

    .btn-secondary:hover {
      background: #444;
    }

    .error-message {
      color: #ff4444;
      font-size: 12px;
      margin-top: 5px;
      display: none;
    }

    .success-message {
      color: #44ff44;
      font-size: 12px;
      margin-top: 5px;
      display: none;
    }

    .user-info {
      background: #2a2a2a;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 20px;
    }

    .user-email {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .connection-status {
      font-size: 12px;
      color: #aaa;
    }

    .status-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 5px;
    }

    .status-connected {
      background: #44ff44;
    }

    .status-disconnected {
      background: #ff4444;
    }

    .toggle-form {
      text-align: center;
      margin-top: 15px;
    }

    .toggle-form a {
      color: #ff0000;
      text-decoration: none;
      font-size: 12px;
    }

    .toggle-form a:hover {
      text-decoration: underline;
    }

    .session-info {
      background: #2a2a2a;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 15px;
    }

    .session-info h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
    }

    .session-details {
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="logo">
    <h1>🎵 Music Continuity</h1>
  </div>

  <div id="authContainer" class="auth-container">
    <form id="authForm">
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" required>
      </div>
      
      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" required>
      </div>
      
      <button type="submit" class="btn" id="authButton">Sign In</button>
      
      <div id="errorMessage" class="error-message"></div>
      <div id="successMessage" class="success-message"></div>
    </form>
    
    <div class="toggle-form">
      <a href="#" id="toggleAuth">Don't have an account? Register</a>
    </div>
  </div>

  <div id="userContainer" class="user-container">
    <div class="user-info">
      <div class="user-email" id="userEmail"></div>
      <div class="connection-status">
        <span class="status-indicator" id="statusIndicator"></span>
        <span id="connectionStatus">Checking connection...</span>
      </div>
    </div>

    <div id="sessionInfo" class="session-info" style="display: none;">
      <h3>Current Session</h3>
      <div class="session-details" id="sessionDetails"></div>
    </div>

    <button class="btn" id="saveSessionBtn">💾 Save Current Session</button>
    <button class="btn btn-secondary" id="resumeSessionBtn" style="display: none;">▶️ Resume Last Session</button>
    <button class="btn btn-secondary" id="signOutBtn">Sign Out</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
